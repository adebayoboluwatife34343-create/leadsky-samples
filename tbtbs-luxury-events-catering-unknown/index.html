for(let i=0;i<3;i++)mesh(new T.TubeGeometry(new BraidCurve(i*Math.PI*2/3),110,.17,12,false),i===1?ceramic:metal);
break;
case 'flower':
mesh(new T.SphereGeometry(.32,24,24),metal);
for(let i=0;i<8;i++){const angle=i*Math.PI/4;const p=mesh(new T.SphereGeometry(.5,24,16),i%2?ceramic:glass,Math.cos(angle)*.63,Math.sin(angle)*.63,0);p.scale.set(1,.6,.3);p.rotation.z=angle}
tube([[0,-.3,0],[.1,-1,0],[-.1,-1.8,0]],.035,dark);break;
case 'cake':
cylinder(.95,.95,.65,ceramic,0,-.6);cylinder(.7,.7,.6,glass,0,.02);cylinder(.45,.45,.5,ceramic,0,.57);cylinder(.035,.035,.4,metal,0,1.02);mesh(new T.SphereGeometry(.07,16,16),metal,0,1.28);break;
case 'gem':
mesh(new T.OctahedronGeometry(1.25,0),glass);const ring=mesh(new T.TorusGeometry(1.35,.025,10,80),metal);ring.rotation.x=Math.PI/2.8;break;
case 'tooth':
mesh(new T.SphereGeometry(.7,32,24),ceramic,0,.45).scale.set(1.2,.9,.7);
for(const x of [-.36,.36]){const tooth=mesh(new T.ConeGeometry(.29,1.5,24),ceramic,x,-.5);tooth.rotation.z=Math.PI+(x>0?-.15:.15)}
break;
case 'scales':
cylinder(.45,.6,.13,dark,0,-1.3);cylinder(.045,.045,2.3,metal,0,-.1);
const beam=mesh(new T.BoxGeometry(2.3,.06,.08),metal,0,.8);beam.rotation.z=.05;
for(const x of [-.95,.95]){tube([[x-.28,-.1,0],[x,.8,0],[x+.28,-.1,0]],.016);const dish=mesh(new T.SphereGeometry(.43,24,16,0,Math.PI*2,Math.PI/2,Math.PI/2),metal,x,-.05);dish.scale.y=.35}
break;
case 'car':
mesh(new T.BoxGeometry(2.4,.45,1),glass,0,-.2);mesh(new T.BoxGeometry(1.25,.55,.9),ceramic,-.1,.24);
for(const x of [-.77,.77])for(const z of [-.52,.52]){const wheel=mesh(new T.CylinderGeometry(.3,.3,.14,32),dark,x,-.4,z);wheel.rotation.x=Math.PI/2;const hub=mesh(new T.CylinderGeometry(.15,.15,.15,24),metal,x,-.4,z);hub.rotation.x=Math.PI/2}
break;
case 'bottle':
mesh(new T.BoxGeometry(1.4,1.75,.72),glass,0,-.2);mesh(new T.BoxGeometry(.95,.62,.77),dark,0,1.03);mesh(new T.BoxGeometry(.9,.65,.025),ceramic,0,-.15,.375);mesh(new T.BoxGeometry(.52,.025,.03),metal,0,-.08,.4);break;
case 'wave':
class WaveCurve extends T.Curve{constructor(offset){super();this.offset=offset}getPoint(t,target=new T.Vector3()){return target.set((t-.5)*3,Math.sin(t*Math.PI*2+this.offset)*.5,Math.cos(t*Math.PI*2)*.3+this.offset*.2)}}
for(let i=0;i<6;i++)mesh(new T.TubeGeometry(new WaveCurve(i*.4),80,.045,10,false),i%2?ceramic:metal);break;
case 'orb':default:
mesh(new T.SphereGeometry(.95,48,32),glass);for(let i=0;i<2;i++){const r=mesh(new T.TorusGeometry(1.3+i*.1,.025,12,90),metal);r.rotation.set(.6+i,.5+i,0)}}
group.rotation.set(.12,-.3,-.08);
let visible=true,frame=0,targetX=0,targetY=0,running=false,disposed=false;
const hero=document.querySelector('.hero');
hero.addEventListener('pointermove',e=>{if(matchMedia('(pointer:coarse)').matches)return;const r=hero.getBoundingClientRect();targetX=((e.clientX-r.left)/r.width-.5)*.35;targetY=((e.clientY-r.top)/r.height-.5)*.2},{passive:true});
hero.addEventListener('pointerleave',()=>{targetX=targetY=0});
function animate(time){if(disposed||!visible||document.hidden||reduced.matches){running=false;return}running=true;group.rotation.y+=(-.3+targetX+Math.sin(time*.00022)*.12-group.rotation.y)*.035;group.rotation.x+=(.12+targetY-group.rotation.x)*.035;group.position.y=Math.sin(time*.00055)*.06;renderer.render(scene,camera);frame=requestAnimationFrame(animate)}
function resume(){if(!running&&visible&&!document.hidden&&!reduced.matches)frame=requestAnimationFrame(animate)}
if('IntersectionObserver'in window)new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;resume()},{threshold:0}).observe(hero);
document.addEventListener('visibilitychange',resume);reduced.addEventListener('change',()=>{if(reduced.matches){cancelAnimationFrame(frame);running=false}else resume()});
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();disposed=true;cancelAnimationFrame(frame);renderer.domElement.remove()});resume();
}
if('requestIdleCallback'in window)requestIdleCallback(loadScene,{timeout:1800});else setTimeout(loadScene,400);
</script>
