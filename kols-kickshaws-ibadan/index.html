  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(400,400);renderer.setClearColor(0,0);host.append(renderer.domElement);
  scene.add(new THREE.HemisphereLight(SITE.colors.surface,SITE.colors.brand,1.4));
  const key=new THREE.DirectionalLight(SITE.colors.surface,1.8);key.position.set(3,4,5);scene.add(key);
  const rim=new THREE.DirectionalLight(SITE.colors.accent,1.2);rim.position.set(-4,-1,2);scene.add(rim);
  const group=new THREE.Group();scene.add(group);
  const material=new THREE.MeshStandardMaterial({color:SITE.colors.accent,roughness:.35,metalness:.18});
  const secondary=new THREE.MeshStandardMaterial({color:SITE.colors.brand,roughness:.4,metalness:.25});
  function mesh(geometry,mat=material,x=0,y=0,z=0,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geometry,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);group.add(m);return m}
  function line(a,b,r=.035,mat=secondary){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);const m=mesh(new THREE.CylinderGeometry(r,r,d.length(),16),mat);m.position.copy(A.add(B).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m}
  class RibbonCurve extends THREE.Curve{
   constructor(offset=0,braid=false){super();this.offset=offset;this.braid=braid}
   getPoint(t,target=new THREE.Vector3()){const a=t*Math.PI*(this.braid?5:2)+this.offset;return this.braid?target.set(Math.sin(a)*.35,(t-.5)*3,Math.cos(a)*.35):target.set((t-.5)*3,Math.sin(a)*.38,Math.cos(a)*.3)}
  }
  const shape=SITE.hero.shape3d;
  if(shape==='flower'){
   for(let ring=0;ring<2;ring++)for(let i=0;i<7;i++){const a=i/7*Math.PI*2+ring*.4;const m=mesh(new THREE.SphereGeometry(1,28,20),ring?secondary:material,Math.cos(a)*(.6+ring*.22),Math.sin(a)*(.6+ring*.22),-ring*.2,.38,.78,.16);m.rotation.z=a-Math.PI/2}
   mesh(new THREE.SphereGeometry(.29,24,20),material,0,0,.25);
   group.rotation.x=.3;
  }else if(shape==='braid'){
   for(let i=0;i<3;i++)mesh(new THREE.TubeGeometry(new RibbonCurve(i*Math.PI*2/3,true),110,.105,12,false),i===1?secondary:material);
   group.rotation.z=-.3;
  }else if(shape==='cake'){
   mesh(new THREE.CylinderGeometry(1.05,1.05,.65,64),material,0,-.45);
   mesh(new THREE.CylinderGeometry(.78,.78,.65,64),secondary,0,.2);
   mesh(new THREE.CylinderGeometry(.81,.81,.08,64),material,0,.55);
   for(let i=0;i<7;i++){const a=i/7*Math.PI*2;mesh(new THREE.SphereGeometry(.11,16,12),material,Math.cos(a)*.64,.65,Math.sin(a)*.64)}
   line([0,.58,0],[0,1.15,0],.035);mesh(new THREE.SphereGeometry(.09,16,12),material,0,1.27,0, .7,1.5,.7);
   group.rotation.x=.2;
  }else if(shape==='gem'){
   const gem=mesh(new THREE.OctahedronGeometry(1.25,0));gem.scale.y=1.25;
   mesh(new THREE.TorusGeometry(1.65,.022,8,100),secondary).rotation.x=1.1;
  }else if(shape==='tooth'){
   mesh(new THREE.SphereGeometry(.85,32,24),material,0,.45,0,1.1,.8,.7);
   for(const x of [-.43,.43]){const m=mesh(new THREE.ConeGeometry(.38,1.6,32),material,x,-.52,0);m.rotation.z=Math.PI+(x>0?-.16:.16)}
  }else if(shape==='scales'){
   line([0,-1.2,0],[0,1.1,0],.06);line([-1.25,.7,0],[1.25,.7,0],.05);mesh(new THREE.CylinderGeometry(.65,.8,.12,40),secondary,0,-1.2);
   [-1,1].forEach(x=>{line([x,.7,0],[x,-.3,0],.02);const bowl=mesh(new THREE.SphereGeometry(.49,32,16,0,Math.PI*2,Math.PI/2,Math.PI/2),material,x,-.3,0);bowl.scale.y=.4});
   mesh(new THREE.SphereGeometry(.13,20,16),material,0,1.15);
  }else if(shape==='car'){
   mesh(new THREE.BoxGeometry(2.65,.45,1.15),material,0,-.2);
   mesh(new THREE.BoxGeometry(1.45,.55,.99),material,-.15,.25);
   [-.85,.85].forEach(x=>[-.61,.61].forEach(z=>{const wheel=mesh(new THREE.CylinderGeometry(.3,.3,.15,32),secondary,x,-.42,z);wheel.rotation.x=Math.PI/2}));
   mesh(new THREE.BoxGeometry(.05,.35,1.01),secondary,.6,.27);
   group.rotation.set(.3,-.6,0);
  }else if(shape==='bottle'){
   const points=[[0,-1.2],[.55,-1.2],[.63,-1.08],[.63,.3],[.5,.55],[.22,.8],[.22,1.15],[0,1.15]].map(p=>new THREE.Vector2(...p));
   mesh(new THREE.LatheGeometry(points,64));
   mesh(new THREE.CylinderGeometry(.25,.25,.25,40),secondary,0,1.2);
   mesh(new THREE.CylinderGeometry(.635,.635,.65,64),secondary,0,-.35);
  }else if(shape==='wave'){
   for(let i=0;i<5;i++){const m=mesh(new THREE.TubeGeometry(new RibbonCurve(i*.23),90,.055,10,false),i%2?secondary:material);m.position.y=(i-2)*.22}
   group.rotation.set(.2,-.3,-.3);
  }else{
   mesh(new THREE.SphereGeometry(1,48,32));
   mesh(new THREE.TorusGeometry(1.42,.045,16,100),secondary).rotation.set(1,.4,.2);
  }
  let visible=false,frame=0,targetX=0,targetY=0,stopped=false;
  const hero=document.querySelector('.hero');
  hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();targetX=(e.clientX-r.left)/r.width-.5;targetY=(e.clientY-r.top)/r.height-.5});
  hero.addEventListener('pointerleave',()=>{targetX=targetY=0});
  const initialX=group.rotation.x,initialY=group.rotation.y;
  function draw(time){frame=0;if(!visible||stopped||document.hidden)return;group.rotation.y+=(initialY+targetX*.42+Math.sin(time*.00025)*.12-group.rotation.y)*.035;group.rotation.x+=(initialX+targetY*.22-group.rotation.x)*.035;group.position.y=Math.sin(time*.0005)*.055;renderer.render(scene,camera);frame=requestAnimationFrame(draw)}
  function start(){if(visible&&!stopped&&!document.hidden&&!frame)frame=requestAnimationFrame(draw)}
  new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(!visible&&frame){cancelAnimationFrame(frame);frame=0}else start()},{threshold:.05}).observe(hero);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&frame){cancelAnimationFrame(frame);frame=0}else start()});
  reduced.addEventListener('change',e=>{stopped=e.matches;if(stopped){cancelAnimationFrame(frame);frame=0}else start()});
  renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();stopped=true;cancelAnimationFrame(frame);frame=0;renderer.domElement.style.display='none'});
 }
})();
</script>
