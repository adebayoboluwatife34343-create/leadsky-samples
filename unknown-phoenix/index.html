<style>
:root{--ease:cubic-bezier(.22,.7,.18,1);--fh:Georgia,'Times New Roman',serif;--fb:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--bg:#fbf7f1;--surface:#fff;--text:#2b1e1b;--muted:#6a5a54;--brand:#5a2434;--accent:#8a642a;--brand-text:#5a2434;--accent-text:#8a642a;--muted-text:#6a5a54;--on-brand:#fff;--alt:#f4eee6;--line:rgba(43,30,27,.14);--text-rgb:43,30,27;--bg-rgb:251,247,241;--brand-rgb:90,36,52;--accent-rgb:138,100,42;--on-brand-rgb:255,255,255;--ph1:#eadfdb;--ph2:#e6d9c3;--hdr:68px}

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:clamp(1.8rem,3vw,2.6rem) clamp(1.2rem,2.5vw,2rem)}

let stack=[];
const FOC='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const focusables=r=>$$(FOC,r).filter(e=>e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
function openL(el,op){el.classList.add('open');el._op=op||document.activeElement;if(stack.indexOf(el)<0)stack.push(el);document.body.classList.add('lock');
  setTimeout(()=>{const f=$('[data-af]',el)||focusables(el)[0];if(f)f.focus({preventScroll:true})},80)}
function closeL(el,noFocus){el.classList.remove('open');stack=stack.filter(x=>x!==el);if(!stack.length)document.body.classList.remove('lock');if(!noFocus&&el._op&&el._op.focus)el._op.focus({preventScroll:true})}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(stack.length)closeL(stack[stack.length-1]);else if($('#nav').classList.contains('open')){$('#nav').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');$('#menuBtn').focus()}}
  if(e.key==='Tab'&&stack.length){const t=stack[stack.length-1],f=focusables(t);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===a||!t.contains(document.activeElement))){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  if($('#lb').classList.contains('open')){if(e.key==='ArrowLeft')lbShow(lbI-1);if(e.key==='ArrowRight')lbShow(lbI+1)}
});

      chk('c-addr',req),chk('c-city',req),chk('c-date',v=>v&&v>=todayStr?'':'Choose a date from today onwards.')].filter(Boolean);
    if(bad.length){bad[0].focus();return}
    order={name:$('#c-name').value.trim(),phone:$('#c-phone').value.trim(),email:$('#c-email').value.trim(),addr:isPick()?'':$('#c-addr').value.trim(),city:isPick()?'':$('#c-city').value.trim(),date:$('#c-date').value,slot:slots.length?$('#c-slot').value:'',note:$('#c-note').value.trim()};
    ref='DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase();
    $('#sum').innerHTML=sumHTML();$('#bk-amt').textContent=money(subtotal()+ship());$('#bk-ref').textContent=ref;
    if(!$('#u-phone').value)$('#u-phone').value=order.phone;
    goStep(2);
  });
  $('#f2').addEventListener('submit',e=>{e.preventDefault();
    const pm=$('input[name=pm]:checked',sh).value;let bad=[];
    if(pm==='card'){const now=new Date(),cy=now.getFullYear()%100,cm=now.getMonth()+1;
      bad=[chk('p-cname',req),chk('p-cnum',v=>{const d=v.replace(/\D/g,'');return d.length>=13&&d.length<=19?'':'Enter a valid card number.'}),
      chk('p-exp',v=>{const m=/^(\d\d)\/(\d\d)$/.exec(v);if(!m||+m[1]<1||+m[1]>12)return 'Use the format MM/YY.';return (+m[2]>cy||(+m[2]===cy&&+m[1]>=cm))?'':'This card has expired.'}),
      chk('p-cvc',v=>/^\d{3,4}$/.test(v)?'':'Enter the 3 or 4 digit code.')].filter(Boolean)}
    else if(pm==='ussd')bad=[chk('u-phone',v=>v.replace(/\D/g,'').length>=7?'':'Enter a valid phone number.')].filter(Boolean);
    if(bad.length){bad[0].focus();return}
    const b=$('#payBtn');b.disabled=true;b.setAttribute('aria-busy','true');b.innerHTML='<span class="spin" aria-hidden="true"></span> Processing';
    setTimeout(()=>finish(),1500);
  });
}
function finish(){
  const lines=cart.map(l=>'- '+l.q+' × '+items[l.i].name+(items[l.i].price>0?' ('+money(items[l.i].price*l.q)+')':' ('+priceOf(items[l.i])+')')).join('\n');
  const o=dOpt(),total=money(subtotal()+ship());
  const msg='Hello '+(B.name||'')+', I would like to place this order (demo ref '+ref+'):\n'+lines+'\nDelivery: '+(o?o.name:'')+'\nTotal: '+total+'\nName: '+order.name+'\nDate: '+order.date+(order.slot?', '+order.slot:'')+(order.addr?'\nAddress: '+order.addr+', '+order.city:'')+(order.note?'\nNote: '+order.note:'');
  const html=sumHTML();
  $('#s3').innerHTML='<div class="done"><div class="tick">'+IC.check+'</div><p class="eyebrow" style="justify-content:center">Reference '+esc(ref)+'</p><h3>Demo checkout: nothing was charged</h3><p class="small" style="margin-bottom:1.4rem">Thank you, '+esc(order.name.split(' ')[0])+'. No order was sent and no payment was taken. In a live store the seller would now confirm your order'+(order.date?' for '+esc(order.date):'')+'.</p>'+html+
    '<div class="acts">'+(wa?'<a class="btn ghost" href="'+esc(wa)+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">'+IC.chat+'Open WhatsApp with this order</a>':'')+'<button class="btn" type="button" id="doneBtn">Back to the shop</button></div></div>';
  $('#doneBtn').addEventListener('click',()=>{closeL(co,true);const s=$('#shop')||$('#top');s.scrollIntoView({behavior:RM?'auto':'smooth'})});
  done=true;cart=[];save();renderCart();goStep(3);
}
const co=$('#co');
function openCheckout(op){
  if(!cart.length)return;
  if(done||!$('#f1')){done=false;buildCo()}
  const p=$('#pay-reset');$('#addrBox').hidden=isPick();
  const b=$('#payBtn');if(b){b.disabled=false;b.removeAttribute('aria-busy');b.textContent='Pay now'}
  goStep(1);closeL($('#drawerL'),true);openL(co,op||$('#bagBtn'));
}

/* ---------- global clicks ---------- */
document.addEventListener('click',e=>{

    gem(){const g=new T.Group();const pts=[[.001,-1.3],[1.3,0],[1.3,.1],[.8,.65],[.001,.65]].map(p=>new T.Vector2(p[0],p[1]));

    cake(){const g=new T.Group();
      const plate=new T.Mesh(new T.CylinderGeometry(1.75,1.75,.07,64),std(P.light,{roughness:.3}));plate.position.y=-.035;g.add(plate);

    scales(){const g=new T.Group(),mt=gold();

      const pans=[-1.7,1.7].map(x=>{const pg=new T.Group();pg.position.set(x,.4,0);
        const bowl=new T.Mesh(new T.SphereGeometry(.7,40,16,0,Math.PI*2,Math.PI/2,Math.PI/2),std(P.brand,{side:T.DoubleSide,roughness:.3,metalness:.3}));bowl.scale.y=.45;pg.add(bowl);
        for(let k=0;k<3;k++){const a=k*Math.PI*2/3;pg.add(rod(V(0,1.1,0),V(Math.cos(a)*.7,0,Math.sin(a)*.7),.012,mt))}g.add(pg);return pg});
      g.userData.u=t=>{pans[0].position.y=.4+Math.sin(t)*.05;pans[1].position.y=.4-Math.sin(t)*.05};return g},
    car(){const g=new T.Group();const s=new T.Shape();

  };
  const shape=(S[H.shape3d]||S.orb)();

  const desk=matchMedia('(min-width:900px)');
  function resize(){

    const halfH=Math.tan(camera.fov*Math.PI/360)*camera.position.z,ppu=Hh/(2*halfH);let cx,cy,size;
    if(desk.matches){const ar=art.getBoundingClientRect();cx=ar.left-hr.left+ar.width/2;cy=ar.top-hr.top+ar.height/2;size=Math.min(ar.width,ar.height)*.85}
    else{cx=W/2;cy=Math.min(Hh*.32,330);size=Math.min(W*.8,Hh*.42)}

  }

  if('IntersectionObserver' in window)new IntersectionObserver(es=>{vis=es[0].isIntersecting;vis?start():stop()}).observe(hero);else start();
  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

}
function load3(){
