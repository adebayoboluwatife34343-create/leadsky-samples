 const pts=arr(SITE.points);
 if(!AB.title&&!AB.text&&!pts.length)return rm('about');
 $('#about').innerHTML=`<div class="wrap">${AB.title||AB.text?`<div class="about-g"><div class="about-v rv"><div class="im">${pic(AB.image,AB.title||B.name)}</div></div><div class="about-t rv"><p class="eyebrow">About</p>${AB.title?`<h2>${esc(AB.title)}</h2>`:''}${String(AB.text||'').split(/\n\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>`:''}${pts.length?`<div class="pts">${pts.map((p,i)=>`<div class="rv" style="--d:${i*.12}s"><b>${p2(i+1)}</b><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>`).join('')}</div>`:''}</div>`;
}
function buildSteps(){
 const s=arr(SITE.steps);if(!s.length)return rm('steps');
 $('#steps').innerHTML=`<div class="wrap"><div class="sh rv"><p class="eyebrow">How it works</p><h2>From first click to your chair</h2></div><ol class="stl">${s.map((x,i)=>`<li class="rv" style="--d:${i*.12}s"><span class="nm">${p2(i+1)}</span><div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div></li>`).join('')}</ol></div>`;
}
const gal=arr(SITE.gallery);let li=0;
function buildGallery(){
 if(!gal.length)return rm('gallery');
 $('#gallery').innerHTML=`<div class="wrap"><div class="sh rv"><p class="eyebrow">Gallery</p><h2>A look around</h2></div><div class="gal rv${gal.length>=5?' mix':''}" ${gal.length<3?`style="grid-template-columns:repeat(${gal.length},1fr)"`:''}>${gal.map((g,i)=>`<button type="button" class="g" data-g="${i}" aria-label="Open image: ${esc(g.caption||('Image '+(i+1)))}"><span class="im">${pic(g.image,g.caption||B.name)}</span>${g.caption?`<span class="cap">${esc(g.caption)}</span>`:''}</button>`).join('')}</div></div>`;
 const lb=$('#lb'),img=$('img',lb);
 const show=i=>{li=(i+gal.length)%gal.length;const g=gal[li];img.src=g.image;img.alt=g.caption||B.name;$('figcaption',lb).textContent=g.caption||''};
 $('#gallery').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b||!b.querySelector('img')||!lb.showModal)return;show(+b.dataset.g);lb.showModal()});
 lb.addEventListener('click',e=>{if(e.target===lb||e.target.closest('.lb-x'))lb.close();else if(e.target.closest('.lb-p'))show(li-1);else if(e.target.closest('.lb-n'))show(li+1)});
 lb.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(li-1);if(e.key==='ArrowRight')show(li+1)});
}
function buildVideos(){
 const v=arr(SITE.videos);if(!v.length)return rm('videos');
 $('#videos').innerHTML=`<div class="wrap"><div class="sh rv"><p class="eyebrow">Watch</p><h2>In motion</h2></div><div class="vids">${v.map(x=>`<div class="vid rv"><button type="button" class="tt-play" data-player="${esc(x.player)}" aria-label="Play video"><img src="${esc(x.poster)}" alt="" loading="lazy" onerror="this.remove()"><span class="pl" aria-hidden="true">${IC.play}</span></button>${x.link?`<a class="op" href="${esc(x.link)}" target="_blank" rel="noopener">Open</a>`:''}</div>`).join('')}</div></div>`;
 $('#videos').addEventListener('click',e=>{const b=e.target.closest('.tt-play');if(!b)return;const f=document.createElement('iframe');f.src=b.dataset.player;f.allow='autoplay; fullscreen';f.allowFullscreen=true;f.title='Video player';b.replaceWith(f)});
}
function buildFaq(){
 const q=arr(SITE.faq);if(!q.length)return rm('faq');
 $('#faq').innerHTML=`<div class="wrap"><div class="sh rv"><p class="eyebrow">FAQ</p><h2>Questions, answered</h2></div><div class="faq rv">${q.map(x=>`<details><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join('')}</div></div>`;
}
function buildBand(){
 if(!canBook||!B.tagline)return rm('band');
 $('#band').innerHTML=`<div class="wrap"><h2 class="rv">${esc(B.tagline)}</h2>${B.hours?`<p class="rv">${esc(B.hours)}</p>`:''}<a class="btn lt rv" href="#book">${esc(H.cta_primary||'Book now')}</a></div>`;
}
function buildContact(){
 const li=[];
 if(B.address)li.push([IC.pin,`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(B.address)}" target="_blank" rel="noopener">${esc(B.address)}</a>`]);
 if(B.hours)li.push([IC.clock,`<span style="white-space:pre-line">${esc(B.hours)}</span>`]);
 if(B.phone)li.push([IC.phone,`<a href="tel:${digits(B.phone)}">${esc(B.phone)}</a>`]);
 if(B.whatsapp)li.push([IC.wa,`<a href="https://wa.me/${digits(B.whatsapp).replace('+','')}" target="_blank" rel="noopener">WhatsApp</a>`]);
 if(B.email)li.push([IC.mail,`<a href="mailto:${esc(B.email)}">${esc(B.email)}</a>`]);
 if(B.instagram)li.push([IC.ig,`<a href="${esc(B.instagram)}" target="_blank" rel="noopener">Instagram</a>`]);
 if(B.tiktok)li.push([IC.play.replace(/width="26" height="26"/,''),`<a href="${esc(B.tiktok)}" target="_blank" rel="noopener">TikTok</a>`]);
 if(!li.length&&!B.address)return rm('contact');
 $('#contact').innerHTML=`<div class="wrap cg"><div class="rv"><p class="eyebrow">Visit</p><h2>Find us${B.city?' in '+esc(B.city):''}</h2><ul class="cl">${li.map(x=>`<li>${x[0]}<span>${x[1]}</span></li>`).join('')}</ul></div>${B.address?`<div class="map rv"><iframe title="Map of ${esc(B.name)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(B.address)}&output=embed"></iframe></div>`:''}</div>`;
}
function buildFooter(){
 const cr=arr(SITE.credits);
 $('#ft').innerHTML=`<div class="wrap"><div class="ft-g"><div><h4>${esc(B.name)}</h4><small>${esc(B.tagline||'')}</small></div><div><small>${[B.address,B.phone,B.email].filter(Boolean).map(esc).join('<br>')}</small></div><div>${cr.length?`<ul>${cr.map(c=>`<li>${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.text)}</a>`:esc(c.text)}</li>`).join('')}</ul>`:''}<small style="margin-top:8px">Concept by LeadSky</small></div></div><small style="margin-top:30px">${esc(SITE.banner||'')}</small></div>`;
 let f='';
 if(B.whatsapp)f+=`<a class="fab wa" href="https://wa.me/${digits(B.whatsapp).replace('+','')}?text=${encodeURIComponent('Hello '+B.name+', I would like to book an appointment.')}" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">${IC.wa}</a>`;
 if(B.phone)f+=`<a class="fab cl2" href="tel:${digits(B.phone)}" aria-label="Call ${esc(B.name)}">${IC.phone}</a>`;
 $('#fabs').innerHTML=f;
}
/* build all */
if(canBook){buildBook();buildOwner()}else{rm('book');rm('owner')}
buildServices();buildAbout();buildSteps();buildGallery();buildVideos();buildFaq();buildBand();buildContact();buildFooter();buildHeader();updateNext();
/* reveal */
(function(){
 const els=$$('.rv');
 if(!('IntersectionObserver' in window)||reduce){els.forEach(e=>e.classList.add('in'));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.06});
 els.forEach(e=>io.observe(e));
})();
/* 3D hero */
function killStage(){const s=$('#stage');s&&s.remove()}
function webgl(){try{const c=document.createElement('canvas');return!!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')))}catch(e){return false}}
function scene3d(){
 const st=$('#stage');if(!st||!window.THREE)return;
 const T=THREE;
 const r=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'});
 r.setPixelRatio(Math.min(devicePixelRatio||1,2));st.appendChild(r.domElement);
 const sc=new T.Scene(),cam=new T.PerspectiveCamera(38,1,.1,100);
 const ca=new T.Color(C.accent||'#b38b4d'),cb=new T.Color(C.brand||'#5a2a3c').lerp(new T.Color(0xffffff),.1);
 sc.add(new T.AmbientLight(0xffffff,.75));
 const dl=new T.DirectionalLight(0xffffff,.95);dl.position.set(3,5,6);sc.add(dl);
 const pl=new T.PointLight(ca,.9,30);pl.position.set(-4,-1,4);sc.add(pl);
 const mat=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.38,metalness:.25},o||{}));
 const mB=mat(cb),mA=mat(ca,{metalness:.5,roughness:.28}),mW=mat(0xeadfd0,{roughness:.5,metalness:.05}),mD=mat(0x2b2124,{roughness:.6});
 class Strand extends T.Curve{constructor(p){super();this.p=p}getPoint(t,o){o=o||new T.Vector3();const a=t*Math.PI*7+this.p;return o.set(Math.cos(a)*.55,(t-.5)*4.2,Math.sin(a)*.55)}}
 let tick=null;
 const M=(g,m,x,y,z)=>{const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o};
 const shapes={
  braid(){const g=new T.Group();for(let i=0;i<3;i++)g.add(M(new T.TubeGeometry(new Strand(i*2.0944),180,.22,12,false),i===1?mA:mB));return g},
  flower(){const g=new T.Group(),n=9;for(let k=0;k<2;k++)for(let i=0;i<n;i++){const pv=new T.Group(),p=M(new T.SphereGeometry(1,24,16),k?mA:mB,0,1.15-k*.15,0);p.scale.set(.4,1,.12);p.rotation.x=-.25-k*.35;pv.add(p);pv.rotation.z=(i+k*.5)/n*Math.PI*2;pv.position.z=k*.12;g.add(pv)}g.add(M(new T.SphereGeometry(.42,24,16),mA,0,0,.2));return g},
  cake(){const g=new T.Group();[[1.5,.8,0,mW],[1.05,.75,.78,mB],[.65,.7,1.5,mW]].forEach(a=>{g.add(M(new T.CylinderGeometry(a[0],a[0],a[1],48),a[3],0,a[2],0));const t=M(new T.TorusGeometry(a[0],.07,12,48),mA,0,a[2]+a[1]/2,0);t.rotation.x=Math.PI/2;g.add(t)});g.add(M(new T.CylinderGeometry(.06,.06,.5,12),mA,0,2.1,0));const f=M(new T.SphereGeometry(.1,12,12),new T.MeshBasicMaterial({color:0xffd27a}),0,2.45,0);f.scale.y=1.6;g.add(f);g.add(M(new T.CylinderGeometry(1.9,1.9,.12,48),mA,0,-.46,0));g.rotation.x=.25;return g},
  gem(){const g=new T.Group(),m=mat(cb.clone().lerp(ca,.35),{flatShading:true,roughness:.15,metalness:.35});g.add(M(new T.CylinderGeometry(.85,1.5,.7,8),m,0,.55,0),M(new T.CylinderGeometry(1.5,0,1.9,8),m,0,-.75,0),M(new T.CylinderGeometry(.85,.85,.04,8),mA,0,.9,0));return g},
  tooth(){const g=new T.Group();[-.62,.62].forEach(x=>{const s=M(new T.SphereGeometry(.85,32,24),mW,x,.7,0);s.scale.set(1,.95,.9);g.add(s);const q=M(new T.ConeGeometry(.42,1.6,24),mW,x*.8,-.7,0);q.rotation.x=Math.PI;g.add(q)});const c=M(new T.SphereGeometry(1,32,24),mW,0,.35,0);c.scale.set(1.3,.9,.9);g.add(c);const rg=M(new T.TorusGeometry(1.25,.05,12,64),mA,0,-.05,0);rg.rotation.x=Math.PI/2;g.add(rg);return g},
  scales(){const g=new T.Group();g.add(M(new T.CylinderGeometry(.08,.1,3.2,16),mA),M(new T.CylinderGeometry(.8,.95,.2,32),mB,0,-1.7,0),M(new T.BoxGeometry(3.4,.12,.14),mA,0,1.5,0));[-1.6,1.6].forEach(x=>{g.add(M(new T.CylinderGeometry(.7,.55,.1,32),mB,x,.2,0),M(new T.ConeGeometry(.7,1.3,24,1,true),new T.MeshBasicMaterial({color:ca,wireframe:true}),x,.9,0),M(new T.SphereGeometry(.12,16,16),mA,x,1.5,0))});return g},
  car(){const g=new T.Group();g.add(M(new T.BoxGeometry(3.2,.6,1.5),mB,0,.1,0),M(new T.BoxGeometry(1.6,.55,1.3),mA,-.1,.65,0));[[-1,-.72],[1,-.72],[-1,.72],[1,.72]].forEach(a=>{const w=M(new T.CylinderGeometry(.4,.4,.3,24),mD,a[0],-.2,a[1]);w.rotation.x=Math.PI/2;g.add(w)});return g},
  bottle(){const g=new T.Group();g.add(M(new T.CylinderGeometry(.8,.8,2.2,40),mat(cb,{transparent:true,opacity:.88,roughness:.15}),0,0,0),M(new T.CylinderGeometry(.81,.81,.9,40),mA,0,-.1,0),M(new T.CylinderGeometry(.28,.8,.7,40),mB,0,1.45,0),M(new T.CylinderGeometry(.26,.26,.6,24),mB,0,2.05,0),M(new T.CylinderGeometry(.32,.32,.4,24),mA,0,2.5,0));return g},
  wave(){const geo=new T.PlaneGeometry(5,4,50,40),m=M(geo,mat(cb,{side:T.DoubleSide,roughness:.3,metalness:.3}));m.rotation.x=-1;const p=geo.attributes.position;tick=t=>{for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);p.setZ(i,Math.sin(x*1.3+t*1.2)*.32+Math.cos(y*1.6+t)*.22)}p.needsUpdate=true;geo.computeVertexNormals()};const g=new T.Group();g.add(m);return g},
  orb(){const g=new T.Group();g.add(M(new T.SphereGeometry(1.1,48,32),mat(cb,{roughness:.15,metalness:.4})));[0,1,2].forEach(i=>{const t=M(new T.TorusGeometry(1.7+i*.18,.035,12,120),mA);t.rotation.set(i,i*.6,0);g.add(t)});return g}
 };
 const g=(shapes[H.shape3d]||shapes.orb)();
 const root=new T.Group();root.add(g);root.updateMatrixWorld(true);
 const bb=new T.Box3().setFromObject(g),sz=bb.getSize(new T.Vector3()),ct=bb.getCenter(new T.Vector3());
 g.position.sub(ct);root.scale.setScalar(3.4/Math.max(sz.x,sz.y,sz.z));sc.add(root);
 const size=()=>{const w=st.clientWidth||300,h=st.clientHeight||300;r.setSize(w,h,false);cam.aspect=w/h;let d=2.1/Math.tan(19*Math.PI/180);if(w/h<1)d/=w/h;cam.position.set(0,0,d*1.05);cam.updateProjectionMatrix();r.render(sc,cam)};
 size();if('ResizeObserver' in window)new ResizeObserver(size).observe(st);else addEventListener('resize',size);
 let px=0,py=0,tx=0,ty=0,raf=0,vis=true;const t0=performance.now();
 addEventListener('pointermove',e=>{px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2},{passive:true});
 function frame(now){raf=requestAnimationFrame(frame);const t=(now-t0)/1000;tx+=(px-tx)*.04;ty+=(py-ty)*.04;root.rotation.y=t*.28+tx*.7;root.rotation.x=.15+ty*.3;if(tick)tick(t);r.render(sc,cam)}
 const start=()=>{if(!raf&&vis&&!document.hidden)raf=requestAnimationFrame(frame)},stop=()=>{cancelAnimationFrame(raf);raf=0};
 if('IntersectionObserver' in window)new IntersectionObserver(es=>{vis=es[0].isIntersecting;vis?start():stop()}).observe($('#top'));
 document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
 start();
}
if(!reduce&&webgl()){
 const load=()=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.async=true;s.onload=()=>{try{scene3d()}catch(e){killStage()}};s.onerror=killStage;document.head.appendChild(s)};
 (window.requestIdleCallback||function(f){setTimeout(f,250)})(load);
}else killStage();
})();
</script>
