.xt{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}

.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:block;padding:10px 20px;min-height:44px;border:1px solid var(--line2);border-radius:999px;font-size:14.5px;line-height:1.5}
.chip input:checked+span{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip input:focus-visible+span{outline:2px solid var(--brand);outline-offset:3px}

.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;justify-content:space-between}
.fld{display:grid;gap:6px;margin-bottom:18px}
.fld label{font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.fld input,.fld textarea{padding:14px 16px;min-height:50px;border:1px solid var(--line2);border-radius:4px;background:var(--bg);width:100%}

.err{color:#a32121;font-size:13.5px;min-height:0}
.bk-sum{overflow:hidden}
.bk-sum .media{aspect-ratio:16/10}
.sm{padding:24px}
.sm h3{font-size:26px;line-height:1.15;margin-bottom:4px;overflow-wrap:anywhere}
.sm dl{margin-top:14px}
.sm .r{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}

var ag=$('#again');ag.focus();ag.addEventListener('click',function(){ST.svc=-1;ST.extras={};ST.date=null;ST.time='';ST.d={};frm.reset();$$('#extras input').forEach(function(i){i.checked=false});$$('#picks input').forEach(function(i){i.checked=false});$$('.day').forEach(function(x){x.setAttribute('aria-pressed','false')});pickSync();drawSlots();summary();closeD(CO);go(1,true)})},reduced?0:1100)})}
summary();paint();

/* ===== pointer + 3D ===== */
var ptr={x:0,y:0},hero=$('#hero'),fig=$('.hero-fig');
addEventListener('pointermove',function(e){var b=hero.getBoundingClientRect();if(b.bottom<0||b.top>innerHeight)return;ptr.x=((e.clientX-b.left)/b.width-.5)*2;ptr.y=((e.clientY-b.top)/b.height-.5)*2;if(!reduced&&fig){fig.style.setProperty('--px',(-ptr.x).toFixed(2));fig.style.setProperty('--py',(-ptr.y).toFixed(2))}},{passive:true});

function init3D(){
var gl=$('#gl'),cv=$('canvas',gl),ok=false;
try{var t=document.createElement('canvas');ok=!!(window.WebGLRenderingContext&&(t.getContext('webgl')||t.getContext('experimental-webgl')))}catch(e){}
if(!ok||reduced){gl.classList.add('static');return}
var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.async=true;
s.onload=function(){try{start(gl,cv)}catch(e){gl.classList.add('static')}};s.onerror=function(){gl.classList.add('static')};document.head.appendChild(s)}

function shape(T,name,c1,c2){
var g=new T.Group(),upd=null,axis='y';
var cx=function(h){return new T.Color(h).convertSRGBToLinear()};
var M=function(c,m,r,o){return new T.MeshStandardMaterial(Object.assign({color:c,metalness:m,roughness:r},o||{}))};
var m1=M(c1,.25,.38),m2=M(c2,.45,.3),cream=M(cx(0xf4efe6),.05,.55),dark=M(cx(0x1d1b22),.5,.35);
var add=function(geo,m,x,y,z){var o=new T.Mesh(geo,m);o.position.set(x||0,y||0,z||0);g.add(o);return o};
var PI=Math.PI;
switch(name){
case 'braid':{
class Strand extends T.Curve{constructor(p){super();this.p=p}getPoint(t,v){v=v||new T.Vector3();var a=t*PI*6+this.p;return v.set(Math.sin(a)*.46,(t-.5)*4.4,Math.cos(a)*.26)}}
[0,1,2].forEach(function(i){add(new T.TubeGeometry(new Strand(i*2.0944),170,.21,14,false),i===1?m2:m1)});
add(new T.TorusGeometry(.62,.09,12,40),m2,0,-2.3,0).rotation.x=PI/2;break}
case 'flower':{
for(var l=0;l<3;l++){var n=[8,6,5][l],sy=1-l*.22;for(var i=0;i<n;i++){var a=i/n*PI*2+l*.4,p=add(new T.SphereGeometry(.5,24,16),l%2?m2:m1);p.scale.set(.42,sy,.16);p.position.set(Math.cos(a)*.5*sy,Math.sin(a)*.5*sy,l*.1);p.rotation.z=a-PI/2}}
add(new T.SphereGeometry(.2,24,16),cream,0,0,.4);axis='z';break}
case 'cake':{
[[1.25,.62,-.75,m1],[.92,.55,-.15,cream],[.62,.5,.4,m1]].forEach(function(a){add(new T.CylinderGeometry(a[0],a[0],a[1],48),a[3],0,a[2],0);add(new T.TorusGeometry(a[0],.05,10,64),m2,0,a[2]+a[1]/2,0).rotation.x=PI/2});
add(new T.CylinderGeometry(1.55,1.6,.1,64),m2,0,-1.12,0);add(new T.SphereGeometry(.16,24,16),m2,0,.8,0);add(new T.CylinderGeometry(.03,.03,.4,8),cream,0,1.05,0);break}
case 'gem':{
var gm=M(c1,.2,.12,{flatShading:true});add(new T.CylinderGeometry(.62,1,.5,8,1),gm,0,.45,0);add(new T.ConeGeometry(1,1.4,8),gm,0,-.5,0).rotation.x=PI;
add(new T.CylinderGeometry(.62,.62,.02,8),M(c2,.6,.15,{flatShading:true}),0,.71,0);break}
case 'tooth':{
var cr=add(new T.SphereGeometry(1,40,28),cream,0,.55,0);cr.scale.set(1.15,.95,.9);
[-1,1].forEach(function(s){var r=add(new T.ConeGeometry(.36,1.5,24),cream,s*.5,-.85,0);r.rotation.x=PI;r.rotation.z=-s*.06});
var rg=add(new T.TorusGeometry(1.02,.05,12,56),m1,0,.1,0);rg.rotation.x=PI/2;rg.scale.set(1,.88,1);break}
case 'scales':{
add(new T.CylinderGeometry(.07,.1,3.1,16),m2,0,0,0);add(new T.CylinderGeometry(.7,.8,.14,40),m2,0,-1.6,0);add(new T.BoxGeometry(3.4,.1,.12),m2,0,1.5,0);add(new T.SphereGeometry(.14,20,14),m1,0,1.58,0);
[-1.6,1.6].forEach(function(x){add(new T.CylinderGeometry(.6,.5,.08,40),m1,x,.1,0);add(new T.ConeGeometry(.6,1.4,12,1,true),new T.MeshBasicMaterial({color:c2,wireframe:true}),x,.8,0)});break}
case 'car':{
add(new T.BoxGeometry(3.4,.55,1.5),m1,0,-.15,0);add(new T.BoxGeometry(1.7,.5,1.36),dark,-.1,.35,0);add(new T.BoxGeometry(1.4,.07,1.2),m1,-.1,.62,0);
[[-1,1],[-1,-1],[1,1],[1,-1]].forEach(function(p){var w=add(new T.CylinderGeometry(.4,.4,.3,32),dark,p[0]*1.05,-.5,p[1]*.72);w.rotation.x=PI/2;var h=add(new T.CylinderGeometry(.2,.2,.32,24),m2,p[0]*1.05,-.5,p[1]*.72);h.rotation.x=PI/2});
[-1,1].forEach(function(s){add(new T.SphereGeometry(.12,16,12),m2,1.72,-.1,s*.5)});break}
case 'bottle':{
var pts=[[0,-1.5],[.7,-1.5],[.86,-1.3],[.9,-.6],[.86,.2],[.5,.62],[.3,.85],[.3,1.25],[0,1.25]].map(function(p){return new T.Vector2(p[0],p[1])});
add(new T.LatheGeometry(pts,56),M(c1,.2,.2,{side:T.DoubleSide}));
add(new T.CylinderGeometry(.915,.915,.7,56,1,true),M(cx(0xf4efe6),.05,.55,{side:T.DoubleSide}),0,-.55,0);add(new T.CylinderGeometry(.38,.38,.6,32),m2,0,1.55,0);break}
case 'wave':{
var pg=new T.PlaneGeometry(4,4,40,40),pos=pg.attributes.position,ox=[],oy=[];for(var i=0;i<pos.count;i++){ox.push(pos.getX(i));oy.push(pos.getY(i))}
var wm=add(pg,M(c1,.2,.35,{side:T.DoubleSide}));wm.rotation.x=-1.0;
var wf=new T.Mesh(pg,new T.MeshBasicMaterial({color:c2,wireframe:true,transparent:true,opacity:.35}));wf.rotation.x=-1.0;wf.position.z=.01;g.add(wf);
upd=function(t){for(var i=0;i<pos.count;i++)pos.setZ(i,Math.sin(ox[i]*1.6+t*1.2)*.28+Math.sin(oy[i]*1.3+t*.9)*.2);pos.needsUpdate=true;pg.computeVertexNormals()};axis='none';break}
default:{
add(new T.SphereGeometry(1.15,64,48),m1);
[1.7,2.05].forEach(function(r,i){add(new T.TorusGeometry(r,.035,12,120),m2).rotation.set(1.2+i*.6,i*.9,0)});add(new T.SphereGeometry(.14,20,14),m2,1.7,0,0)}
}
return {g:g,axis:axis,upd:upd}}

function start(gl,cv){
var T=THREE,hero=$('#hero');
var r=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:true,powerPreference:'low-power'});
r.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<700?1.5:1.75));r.outputEncoding=T.sRGBEncoding;
var sc=new T.Scene(),cam=new T.PerspectiveCamera(35,1,.1,50);cam.position.set(0,0,9);
var cc=function(h){return new T.Color(h).convertSRGBToLinear()};
var col=(SITE.colors||{}),c1=cc(col.brand||'#555555'),c2=cc(col.accent||'#aaaaaa');
sc.add(new T.HemisphereLight(0xffffff,c2,.8));
var key=new T.DirectionalLight(0xffffff,1.3);key.position.set(3,5,6);sc.add(key);
var back=new T.DirectionalLight(0xffffff,.55);back.position.set(-3,2,-4);sc.add(back);
var rim=new T.PointLight(c2,1.4,30);rim.position.set(-5,-2,3);sc.add(rim);
var sp=shape(T,H.shape3d||'orb',c1,c2);
var wrap=new T.Group();wrap.add(sp.g);
var bx=new T.Box3().setFromObject(sp.g),sz=bx.getSize(new T.Vector3()),ct=bx.getCenter(new T.Vector3());
sp.g.position.sub(ct);wrap.scale.setScalar(1/Math.max(sz.x,sz.y,sz.z));
var spin=new T.Group();spin.add(wrap);var tilt=new T.Group();tilt.add(spin);var holder=new T.Group();holder.add(tilt);sc.add(holder);
if(sp.axis==='z')tilt.rotation.x=-.25;
function size(){var w=gl.clientWidth,h=gl.clientHeight;if(!w||!h)return;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
var vh=2*Math.tan(cam.fov*PI/360)*cam.position.z,vw=vh*cam.aspect,wide=w>900;
holder.scale.setScalar(wide?Math.min(vh*.46,vw*.3):Math.min(vh*.42,vw*.8));
holder.position.set(wide?vw*.2:0,wide?-vh*.03:vh*.2,0)}
var PI=Math.PI;
size();if('ResizeObserver' in window)new ResizeObserver(size).observe(gl);else addEventListener('resize',size);
var cxp=0,cyp=0,raf=0,run=false,vis=true;
function frame(now){if(!run)return;raf=requestAnimationFrame(frame);var t=now*.001;cxp+=(ptr.x-cxp)*.04;cyp+=(ptr.y-cyp)*.04;
if(sp.axis==='y')spin.rotation.y=t*.32;else if(sp.axis==='z')spin.rotation.z=t*.3;
tilt.rotation.y=cxp*.4+(sp.axis==='none'?Math.sin(t*.3)*.25:0);tilt.rotation.x=(sp.axis==='z'?-.25:0)+cyp*.22;
wrap.position.y=Math.sin(t*.9)*.03;if(sp.upd)sp.upd(t);r.render(sc,cam)}
function go(){if(!run&&vis&&!document.hidden){run=true;raf=requestAnimationFrame(frame)}}
function stop(){run=false;cancelAnimationFrame(raf)}
if('IntersectionObserver' in window)new IntersectionObserver(function(es){vis=es[0].isIntersecting;vis?go():stop()}).observe(hero);
document.addEventListener('visibilitychange',function(){document.hidden?stop():go()});
cv.addEventListener('webglcontextlost',function(e){e.preventDefault();stop();gl.classList.remove('live');gl.classList.add('static')});
r.render(sc,cam);gl.classList.add('live');go()}

(window.requestIdleCallback||function(f){setTimeout(f,250)})(init3D);
})();
</script>
