<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ease:cubic-bezier(.19,.7,.2,1);--line:color-mix(in srgb,var(--text) 14%,transparent);--shadow:0 1px 2px rgba(40,20,30,.05),0 24px 60px -28px rgba(40,20,30,.28);--fh:Georgia,"Times New Roman",serif;--fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.7 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:var(--brand)}
h1,h2,h3{font-family:var(--fh);font-weight:500;line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
.wrap{width:min(1200px,calc(100% - 40px));margin-inline:auto}
.skip{position:absolute;left:-999px;top:8px;background:var(--text);color:var(--bg);padding:10px 16px;z-index:200}
.skip:focus{left:8px}
.banner{background:var(--text);color:var(--bg);font-size:.78rem;line-height:1.4;text-align:center;padding:8px 16px;letter-spacing:.02em}
/* header */
.hd{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .6s,box-shadow .6s}
.hd.sc{border-color:var(--line);box-shadow:0 12px 30px -24px rgba(40,20,30,.5)}
.hd-in{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto;text-decoration:none;color:var(--text)}
.brand b{font-family:var(--fh);font-weight:500;font-size:clamp(1.05rem,4.8vw,1.6rem);line-height:1.1;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.logo,.mono{width:40px;height:40px;flex:none}
.logo{object-fit:contain}
.mono{border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-family:var(--fh);font-size:1.3rem;color:var(--brand)}
.nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 20px 22px;box-shadow:0 24px 40px -30px rgba(40,20,30,.5)}
.nav.open{display:block}
.nav a{display:block;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase}
.nav a:hover{color:var(--brand)}
.burger{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer;color:var(--text);display:grid;place-items:center;flex:none}
.hd .btn.sm{display:none}
@media (min-width:980px){
 .burger{display:none}
 .nav{display:flex;position:static;padding:0;border:0;background:none;box-shadow:none;gap:26px}
 .nav a{border:0;padding:6px 0;position:relative}
 .nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
 .nav a:hover::after{transform:scaleX(1)}
 .nav .mcall{display:none}
 .hd .btn.sm{display:inline-flex}
 .brand{flex:0 1 auto}
 .hd-in{justify-content:space-between}
}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.95em 1.8em;border-radius:999px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font:500 .78rem/1.2 var(--fb);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;min-height:48px;transition:transform .6s var(--ease),box-shadow .6s var(--ease),background .5s,color .5s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px -16px color-mix(in srgb,var(--brand) 80%,transparent)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.ghost:hover{background:color-mix(in srgb,var(--brand) 8%,transparent)}
.btn.sm{padding:.7em 1.3em;min-height:42px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.light{background:var(--bg);color:var(--brand);border-color:var(--bg)}
/* hero */
.hero{position:relative;overflow:hidden;padding:clamp(36px,6vw,90px) 0 clamp(56px,8vw,110px);background:radial-gradient(900px 600px at 85% 15%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%),radial-gradient(700px 520px at 0% 100%,color-mix(in srgb,var(--brand) 11%,transparent),transparent 70%),var(--bg)}

.hero-in{position:relative;display:grid;gap:clamp(28px,5vw,80px);align-items:center}
.hero-copy{position:relative;z-index:3}
.eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--brand);font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--accent)}
.hero h1{font-size:clamp(2.7rem,9.5vw,5.5rem);line-height:1}
.lead{font-size:clamp(1.05rem,2.4vw,1.2rem);color:var(--muted);max-width:34em;margin-top:22px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.stats{display:flex;flex-wrap:wrap;gap:0;margin-top:44px;border-top:1px solid var(--line)}
.stat{flex:1 1 150px;padding:18px 18px 0 0}
.stat b{display:block;font-family:var(--fh);font-weight:500;font-size:1.7rem;color:var(--brand);line-height:1.1}
.stat span{font-size:.84rem;color:var(--muted);line-height:1.4;display:block;margin-top:4px}
.hero-art{position:relative;z-index:1}
.arch-w{position:relative;max-width:440px;margin-left:auto}
.arch{aspect-ratio:16/11;border-radius:999px 999px 8px 8px;box-shadow:var(--shadow)}
.fr{position:relative;overflow:hidden;background:color-mix(in srgb,var(--accent) 20%,var(--bg))}
.fr>img,.fr>.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fr img{transition:transform 1.8s var(--ease)}
.ph{display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 22%,var(--bg)),color-mix(in srgb,var(--accent) 38%,var(--bg)))}
.ph svg{width:56px;height:56px;stroke:var(--brand);fill:none;stroke-width:1.4;opacity:.8}
@media (min-width:860px){
 .hero canvas{left:auto;right:0;width:52%;opacity:1;z-index:2}
 .hero-in{grid-template-columns:1.05fr .95fr}
 .arch{aspect-ratio:4/5;border-radius:999px 999px 8px 8px}
 .arch-w::before{content:"";position:absolute;inset:16px -16px -16px 16px;border:1px solid var(--accent);border-radius:999px 999px 8px 8px;z-index:-1}
}
/* sections */
section.s{padding:clamp(72px,10vw,140px) 0}
section.alt{background:color-mix(in srgb,var(--accent) 9%,var(--bg))}
.sh{max-width:46rem;margin-bottom:clamp(32px,5vw,60px)}
.sh h2{font-size:clamp(2.1rem,5vw,3.7rem)}
.sh p.sub{color:var(--muted);margin-top:16px;font-size:1.06rem}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
/* calculator */
.calc{display:grid;gap:clamp(24px,4vw,56px);align-items:start}
.opts{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.opt{display:grid;gap:12px 20px;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);transition:background .8s var(--ease)}
.opt:last-child{border-bottom:0}
.opt.sel{background:color-mix(in srgb,var(--accent) 11%,var(--surface))}
.opt-i{min-width:0}
.opt-n{display:block;font-family:var(--fh);font-size:1.4rem;line-height:1.2;overflow-wrap:anywhere}
.opt-p{display:block;color:var(--muted);font-size:.9rem}
.opt-c{display:flex;align-items:center;justify-content:space-between;gap:16px}
.opt-t{min-width:72px;font-family:var(--fh);font-size:1.25rem;color:var(--brand)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.step button{width:46px;height:46px;border:0;background:none;font-size:1.3rem;color:var(--brand);cursor:pointer;border-radius:50%;transition:background .4s}
.step button:hover{background:color-mix(in srgb,var(--brand) 10%,transparent)}
.step input{width:44px;text-align:center;border:0;background:none;font:500 1rem var(--fb);color:var(--text);-moz-appearance:textfield;appearance:textfield;padding:0}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(24px,3vw,36px);box-shadow:var(--shadow);border-top:3px solid var(--accent)}
.sum h3{font-size:1.9rem}
.lines{list-style:none;margin:20px 0 0;padding:0;min-height:60px}
.lines li{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.lines li small{grid-column:1;color:var(--muted)}
.lines li span:last-child{grid-row:1/3;grid-column:2;align-self:center;font-weight:500}
.lines .empty{display:block;color:var(--muted);border:0}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:20px}
.tot span{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tot strong{font-family:var(--fh);font-weight:500;font-size:clamp(2.4rem,6vw,3.2rem);color:var(--brand);line-height:1}
.note{font-size:.84rem;color:var(--muted);margin-top:14px;line-height:1.55}
.sum .btn{width:100%;margin-top:18px}
.sum .lnk{display:block;text-align:center;margin-top:12px;background:none;border:0;color:var(--muted);font:inherit;font-size:.86rem;text-decoration:underline;cursor:pointer;min-height:44px;width:100%}
@media (min-width:600px){.opt{grid-template-columns:1fr auto;padding:22px 30px}.opt-c{gap:24px}}
@media (min-width:940px){.calc{grid-template-columns:1.25fr .75fr}.sum{position:sticky;top:96px}}
/* collections */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:.6em 1.3em;border-radius:999px;font:500 .8rem var(--fb);letter-spacing:.08em;cursor:pointer;min-height:44px;transition:all .5s var(--ease)}
.pill[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.grid{display:grid;gap:clamp(22px,3vw,38px);grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.card{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform 1s var(--ease),box-shadow 1s var(--ease)}
.card:hover{transform:translateY(-6px)}
.card:hover .fr img{transform:scale(1.06)}
.card .fr{aspect-ratio:4/5}
.cb{padding:24px 24px 26px;display:flex;flex-direction:column;gap:10px;flex:1}
.cat{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--brand)}
.cb h3{font-size:1.7rem;overflow-wrap:anywhere}
.cb p{color:var(--muted);font-size:.96rem}
.meta{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.meta b{font-family:var(--fh);font-weight:500;font-size:1.4rem;color:var(--brand);white-space:nowrap}
.cb a.more{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;font-weight:500}
.cb a.more:hover{text-decoration:underline}
/* about */
.about{display:grid;gap:clamp(32px,6vw,90px);align-items:center}
.about .fr{aspect-ratio:4/5;border-radius:240px 240px 10px 10px;box-shadow:var(--shadow);max-width:480px}
.about h2{font-size:clamp(2.2rem,5vw,3.8rem);margin-bottom:24px}
.about p+p{margin-top:16px}
.about p{color:var(--muted);font-size:1.08rem;max-width:34em}
@media (min-width:860px){.about{grid-template-columns:.85fr 1.15fr}}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{position:relative;border:0;padding:0;cursor:pointer;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:none;display:block;width:100%}
.tile .fr{position:absolute;inset:0}
.tile:hover img{transform:scale(1.07)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(to top,rgba(20,10,15,.82),rgba(20,10,15,0));color:#fff;font-size:.9rem;text-align:left;z-index:2}

.vids{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.vcard{display:flex;flex-direction:column;gap:10px}
.tt-play{position:relative;display:block;border:0;padding:0;cursor:pointer;aspect-ratio:16/10;border-radius:14px;overflow:hidden;width:100%;background:var(--text)}
.tt-play img,.tt-play .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbtn{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(20,10,15,.72);display:grid;place-items:center;border:2px solid #fff;transition:transform .7s var(--ease)}

.pbtn svg{width:24px;height:24px;fill:#fff;margin-left:3px}
.vcard iframe{width:100%;aspect-ratio:16/10;border:0;border-radius:14px}
.vcard a{font-size:.85rem}

.steps{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));counter-reset:s}
.step-i{border-top:1px solid var(--accent);padding-top:20px}

.step-i h3{font-size:1.6rem;margin-bottom:8px}
.step-i p,.pt p{color:var(--muted)}
.pts{display:grid;gap:34px 50px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.pt{display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.pt svg{width:22px;height:22px;margin-top:8px;fill:none;stroke:var(--accent);stroke-width:1.6}
.pt h3{font-size:1.55rem}
.pt p{grid-column:2}
/* faq */
.faq{max-width:50rem}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:24px 44px 24px 0;font-family:var(--fh);font-size:1.5rem;line-height:1.25;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-family:var(--fb);font-size:1.6rem;color:var(--brand);transition:transform .6s var(--ease)}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq details p{padding:0 0 26px;color:var(--muted);max-width:40em;animation:fd .9s var(--ease)}
@keyframes fd{from{opacity:0;transform:translateY(-6px)}}
/* cta */
.band{background:var(--brand);color:var(--on-brand);border-radius:28px;padding:clamp(40px,7vw,90px) clamp(24px,5vw,70px);text-align:center;position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:14px;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent);border-radius:18px;pointer-events:none}
.band h2{font-size:clamp(2.2rem,5.5vw,4rem)}
.band p{margin:16px auto 28px;max-width:32em;opacity:.9}
/* contact */
.cg{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.cc h3{font-size:1.5rem;margin-bottom:10px}
.cc p,.cc a{display:block;color:var(--muted);overflow-wrap:anywhere}
.cc a{color:var(--brand);padding:3px 0}
/* footer */
.ft{background:var(--text);color:color-mix(in srgb,var(--bg) 78%,transparent);padding:56px 0 110px;font-size:.9rem}
.ft b{font-family:var(--fh);font-weight:500;font-size:1.7rem;color:var(--bg);display:block;margin-bottom:6px}
.ft a{color:var(--bg)}
.ft ul{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-wrap:wrap;gap:6px 22px}
.ft .cl{margin-top:26px;padding-top:20px;border-top:1px solid color-mix(in srgb,var(--bg) 22%,transparent);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
/* fab */
.fabs{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:12px}
.fab{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:0 12px 28px -8px rgba(0,0,0,.4);transition:transform .6s var(--ease)}
.fab:hover{transform:scale(1.08)}
.fab svg{width:26px;height:26px;fill:#fff}
.fab.wa{background:#128c4a}
.fab.call{background:var(--brand)}
.fab.call svg{fill:var(--on-brand)}
/* modal and lightbox */
.ov{position:fixed;inset:0;z-index:100;background:rgba(25,14,18,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fi .6s var(--ease)}
@keyframes fi{from{opacity:0}}
.pnl{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:clamp(22px,4vw,38px);position:relative;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.pnl h2{font-size:2.2rem;margin-bottom:10px}
.x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;cursor:pointer;color:var(--text)}
.demo-n{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-left:3px solid var(--accent);padding:12px 14px;font-size:.88rem;margin:14px 0;border-radius:4px}
.mini{list-style:none;margin:10px 0 0;padding:0;font-size:.92rem}
.mini li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.mini li.t{font-weight:500;color:var(--brand);border:0;font-size:1.05rem}
.fld{margin-top:14px}
.fld label{display:block;font-size:.8rem;letter-spacing:.06em;margin-bottom:5px}
.fld input,.fld textarea{width:100%;padding:12px 14px;border:1px solid color-mix(in srgb,var(--text) 30%,transparent);border-radius:10px;background:var(--bg);font:inherit;color:var(--text)}
.fld input[aria-invalid=true]{border-color:#a3202f}
.err{color:#a3202f;font-size:.82rem;min-height:1.1em;display:block;margin-top:3px}
.row2{display:grid;gap:0 14px;grid-template-columns:1fr}
@media (min-width:520px){.row2{grid-template-columns:1fr 1fr}}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.lb{background:rgba(15,8,12,.92)}
.lb-st{display:grid;place-items:center;max-width:94vw}
.lb-st img{max-width:92vw;max-height:74vh;border-radius:6px;object-fit:contain}
.lb-st .ph{width:min(80vw,560px);height:56vh;border-radius:6px}
.lb-c{color:#fff;text-align:center;margin-top:14px;font-size:.95rem}
.lb .nb{position:absolute;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font-size:1.4rem;cursor:pointer}
.lb .x{background:rgba(0,0,0,.5);color:#fff;border-color:rgba(255,255,255,.5)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var SITE=JSON.parse(document.getElementById('site-data').textContent);
var B=SITE.brand||{},C=SITE.colors||{},F=SITE.fonts||{},H=SITE.hero||{},A=SITE.about||{},D=SITE.demo||{};
var $=function(s,r){return (r||document).querySelector(s)};
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var root=document.documentElement;

function el(tag,attrs){
  var e=document.createElement(tag),k,v;
  attrs=attrs||{};
  for(k in attrs){v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++){(function add(c){
    if(c==null||c===false)return;
    if(Array.isArray(c)){c.forEach(add);return;}
    e.appendChild(c.nodeType?c:document.createTextNode(c));})(arguments[i]);}
  return e;
}
function svg(html,cls){var s=el('span',{class:cls||''});s.innerHTML=html;return s.firstChild;}

/* theme */
var def={bg:'#f7f1e8',surface:'#fffdf9',text:'#2b2126',muted:'#66585e',brand:'#5a1d3b',accent:'#b48a4c'};
Object.keys(def).forEach(function(k){root.style.setProperty('--'+k,C[k]||def[k]);});
function lum(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');
  var c=[0,2,4].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*c[0]+.7152*c[1]+.0722*c[2];}
root.style.setProperty('--on-brand',lum(C.brand||def.brand)>.4?'#1b1416':'#ffffff');
/* fonts */
function clean(n){return String(n||'').replace(/["<>;{}]/g,'').trim();}
var fh=clean(F.heading),fb=clean(F.body);
if(fh)root.style.setProperty('--fh','"'+fh+'",Georgia,"Times New Roman",serif');
if(fb)root.style.setProperty('--fb','"'+fb+'",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif');
(function(){
  var fam=[];
  function g(n,w){return 'family='+encodeURIComponent(n).replace(/%20/g,'+')+':wght@'+w;}
  if(fh)fam.push(g(fh,'400;500;600'));
  if(fb&&fb!==fh)fam.push(g(fb,'400;500;600'));
  if(!fam.length)return;
  document.head.appendChild(el('link',{rel:'preconnect',href:'https://fonts.googleapis.com'}));
  document.head.appendChild(el('link',{rel:'preconnect',href:'https://fonts.gstatic.com',crossorigin:''}));
  document.head.appendChild(el('link',{rel:'stylesheet',href:'https://fonts.googleapis.com/css2?'+fam.join('&')+'&display=swap'}));
})();
document.title=B.name||'Website concept';

/* helpers */
var sym=B.currency_symbol||'';
function money(n){var v=Number(n)||0;return sym+v.toLocaleString('en-US',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});}
function priceText(it){return Number(it.price)>0?money(it.price):(it.price_label||'On request');}
var ICON='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="4"/><path d="M24 20c-3-6-1-12 0-14 1 2 3 8 0 14zM24 28c3 6 1 12 0 14-1-2-3-8 0-14zM20 24c-6 3-12 1-14 0 2-1 8-3 14 0zM28 24c6-3 12-1 14 0-2 1-8 3-14 0z"/></svg>';
function ph(alt){var d=el('div',{class:'ph',role:'img','aria-label':alt||'Image placeholder'});d.innerHTML=ICON;return d;}
function pic(src,alt,eager){
  if(!src)return ph(alt);
  var i=new Image();i.alt=alt||'';i.decoding='async';
  if(eager){i.fetchPriority='high';}else{i.loading='lazy';}
  i.onerror=function(){if(i.parentNode)i.replaceWith(ph(alt));};
  i.src=src;return i;
}
function rv(e,d){e.classList.add('rv');if(d)e.style.setProperty('--d',d+'ms');return e;}
function paras(t){return String(t||'').split(/\n+/).filter(Boolean).map(function(p){return el('p',{text:p});});}
function digits(s){return String(s||'').replace(/\D/g,'');}
var phoneHref=B.phone?'tel:'+String(B.phone).replace(/[^\d+]/g,''):'';
var waNum=digits(B.whatsapp);
var nav=[];
function sec(id,label,cls){
  var s=el('section',{id:id,class:'s '+(cls||'')});
  if(label)nav.push([id,label]);
  return s;
}
function wrap(){var w=el('div',{class:'wrap'});for(var i=0;i<arguments.length;i++)w.appendChild(arguments[i]);return w;}
function shead(eb,t,sub){
  return rv(el('div',{class:'sh'},el('p',{class:'eyebrow',text:eb}),el('h2',{text:t}),sub?el('p',{class:'sub',text:sub}):null));
}

/* ---------- hero ---------- */
var canvas=el('canvas',{id:'c3d','aria-hidden':'true'});
var statsArr=(SITE.stats||[]).filter(function(s){return s&&s.value;});
var hasCalc=(D.options||[]).length>0;
var hero=el('section',{class:'hero',id:'top'},canvas,
  wrap(el('div',{class:'hero-in'},
    el('div',{class:'hero-copy'},
      H.eyebrow?el('p',{class:'eyebrow',text:H.eyebrow}):null,
      el('h1',{text:H.title||B.name}),
      H.subtitle?el('p',{class:'lead',text:H.subtitle}):null,
      el('div',{class:'cta'},
        H.cta_primary?el('a',{class:'btn',href:hasCalc?'#estimate':'#contact',text:H.cta_primary}):null,
        H.cta_secondary?el('a',{class:'btn ghost',href:(SITE.items||[]).length?'#collections':'#contact',text:H.cta_secondary}):null),
      statsArr.length?el('div',{class:'stats'},statsArr.map(function(s){return el('div',{class:'stat'},el('b',{text:s.value}),el('span',{text:s.label}));})):null),
    el('div',{class:'hero-art'},el('div',{class:'arch-w'},el('div',{class:'arch fr'},pic(H.image,(B.name||'')+(B.tagline?': '+B.tagline:''),true)))))));

/* ---------- calculator ---------- */
var modalApi=null;
function buildCalc(){
  var opts=D.options||[];if(!opts.length)return null;
  var qty=opts.map(function(){return 0;});
  var rows=[],list=el('div',{class:'opts',role:'group','aria-label':'Quote options'});
  opts.forEach(function(o,i){
    var id='q'+i;
    var inp=el('input',{id:id,type:'number',min:0,max:99,value:0,inputmode:'numeric','aria-describedby':id+'p'});
    var dec=el('button',{type:'button','aria-label':'Decrease '+o.name,text:'−'});
    var inc=el('button',{type:'button','aria-label':'Increase '+o.name,text:'+'});
    var lt=el('span',{class:'opt-t','aria-hidden':'true'});
    var row=el('div',{class:'opt'},
      el('div',{class:'opt-i'},el('label',{class:'opt-n','for':id,text:o.name}),
        el('span',{class:'opt-p',id:id+'p',text:(Number(o.price)>0?money(o.price):'Included')+(o.unit?' · '+o.unit:'')})),
      el('div',{class:'opt-c'},lt,el('div',{class:'step'},dec,inp,inc)));
    dec.addEventListener('click',function(){set(i,qty[i]-1);});
    inc.addEventListener('click',function(){set(i,qty[i]+1);});
    inp.addEventListener('input',function(){if(inp.value!=='')set(i,parseInt(inp.value,10),true);});
    inp.addEventListener('change',function(){set(i,parseInt(inp.value,10));});
    rows.push({row:row,inp:inp,lt:lt});list.appendChild(row);
  });
  var linesEl=el('ul',{class:'lines'});
  var tot=el('strong',{text:money(0)});
  var req=el('button',{type:'button',class:'btn',text:'Request this quote',disabled:true});
  var hint=el('p',{class:'note',text:'Add at least one item to request a quote.'});
  var clr=el('button',{type:'button',class:'lnk',text:'Clear selection'});
  var sum=el('aside',{class:'sum','aria-label':'Estimate summary'},
    el('h3',{text:'Your estimate'}),
    el('div',{'aria-live':'polite'},linesEl,el('div',{class:'tot'},el('span',{text:'Estimated total'}),tot)),
    el('p',{class:'note',text:'Indicative only. A final written quote is confirmed by the business after a conversation.'}),
    req,hint,clr);
  var shown=0,raf=0;
  function setTotal(v){
    cancelAnimationFrame(raf);
    if(RM){tot.textContent=money(v);shown=v;return;}
    var from=shown,t0=performance.now();
    (function f(t){var p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);
      shown=from+(v-from)*e;tot.textContent=money(p<1?Math.round(shown):v);
      if(p<1)raf=requestAnimationFrame(f);else shown=v;})(t0);
  }
  function lines(){
    var out=[];
    opts.forEach(function(o,i){if(qty[i]>0)out.push({name:o.name,q:qty[i],price:Number(o.price)||0,amt:qty[i]*(Number(o.price)||0),unit:o.unit||''});});
    return out;
  }
  function total(){return lines().reduce(function(a,l){return a+l.amt;},0);}
  function set(i,v,soft){
    v=isNaN(v)?0:Math.max(0,Math.min(99,v));qty[i]=v;
    if(!soft)rows[i].inp.value=v;
    update();
  }
  function update(){
    var ls=lines(),t=total();
    rows.forEach(function(r,i){
      r.row.classList.toggle('sel',qty[i]>0);
      r.lt.textContent=qty[i]>0?money(qty[i]*(Number(opts[i].price)||0)):'';
    });
    linesEl.replaceChildren.apply(linesEl,ls.length?ls.map(function(l){
      return el('li',{},el('span',{text:l.name}),el('small',{text:l.q+' × '+(l.price>0?money(l.price):'Included')+(l.unit?' ('+l.unit+')':'')}),el('span',{text:money(l.amt)}));
    }):[el('li',{class:'empty',text:'Choose options to build your estimate.'})]);
    req.disabled=!ls.length;hint.hidden=!!ls.length;
    setTotal(t);
  }
  req.addEventListener('click',function(){modalApi&&modalApi.open(lines(),total());});
  clr.addEventListener('click',function(){qty=qty.map(function(){return 0;});rows.forEach(function(r){r.inp.value=0;});update();});
  update();
  var s=sec('estimate','Estimate','alt');
  s.appendChild(wrap(shead('Instant estimate','Build your quote and watch the total as you go','Choose what you need and set quantities. Nothing is sent until you decide.'),
    rv(el('div',{class:'calc'},list,sum),120)));
  return s;
}

/* ---------- collections ---------- */
function buildItems(){
  var items=(SITE.items||[]).filter(function(i){return i&&i.name;});if(!items.length)return null;
  var cats=[];items.forEach(function(i){if(i.category&&cats.indexOf(i.category)<0)cats.push(i.category);});
  var cards=items.map(function(it,idx){
    var c=el('article',{class:'card','data-cat':it.category||''},
      el('div',{class:'fr'},pic(it.image,it.name)),
      el('div',{class:'cb'},
        it.category?el('span',{class:'cat',text:it.category}):null,
        el('h3',{text:it.name}),
        it.description?el('p',{text:it.description}):null,
        el('div',{class:'meta'},el('span',{text:it.duration||''}),el('b',{text:priceText(it)})),
        hasCalc?el('a',{class:'more',href:'#estimate',text:'Build an estimate'}):el('a',{class:'more',href:'#contact',text:'Enquire'})));
    return rv(c,(idx%3)*120);
  });
  var grid=el('div',{class:'grid'},cards);
  var bar=null;
  if(cats.length>1&&items.length>3){
    var btns=['All'].concat(cats).map(function(c,i){
      var b=el('button',{type:'button',class:'pill','aria-pressed':i===0?'true':'false',text:c});
      b.addEventListener('click',function(){
        btns.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
        cards.forEach(function(card){card.hidden=!(i===0||card.getAttribute('data-cat')===c);});
      });return b;});
    bar=el('div',{class:'filters',role:'group','aria-label':'Filter services'},btns);
  }
  var s=sec('collections','Services');
  s.appendChild(wrap(shead('Services','What we make for you'),bar,grid));
  return s;
}

/* ---------- about ---------- */
function buildAbout(){
  if(!A.title&&!A.text)return null;
  var s=sec('about','About','alt');
  s.appendChild(wrap(el('div',{class:'about'},
    rv(el('div',{class:'fr'},pic(A.image,A.title||B.name))),
    rv(el('div',{},el('p',{class:'eyebrow',text:'About'}),el('h2',{text:A.title||B.name}),paras(A.text)),150))));
  return s;
}

/* ---------- gallery and lightbox ---------- */
var lb=null;
function buildGallery(){
  var g=(SITE.gallery||[]).filter(function(x){return x;});if(!g.length)return null;
  var tiles=g.map(function(x,i){
    var b=el('button',{type:'button',class:'tile','aria-label':'View larger: '+(x.caption||('image '+(i+1)))},
      el('div',{class:'fr'},pic(x.image,x.caption||(B.name+' gallery image '+(i+1)))),
      x.caption?el('span',{class:'cap',text:x.caption}):null);
    b.addEventListener('click',function(){openLB(i,b);});
    return rv(b,(i%3)*120);
  });
  var s=sec('gallery','Gallery');
  s.appendChild(wrap(shead('Gallery','Recent work and inspiration'),el('div',{class:'gal'},tiles)));
  return s;
}
var lbIdx=0,lbFocus=null;
function openLB(i,from){
  lbFocus=from;lbIdx=i;
  if(!lb){
    var st=el('div',{class:'lb-st'}),cap=el('p',{class:'lb-c'});
    var cl=el('button',{type:'button',class:'x','aria-label':'Close',text:'×'});
    var pv=el('button',{type:'button',class:'nb','aria-label':'Previous image',text:'‹',style:'left:12px'});
    var nx=el('button',{type:'button',class:'nb','aria-label':'Next image',text:'›',style:'right:12px'});
    lb=el('div',{class:'ov lb',role:'dialog','aria-modal':'true','aria-label':'Image viewer',hidden:true},cl,pv,el('div',{},st,cap),nx);
    lb._st=st;lb._cap=cap;
    cl.addEventListener('click',closeLB);
    pv.addEventListener('click',function(){stepLB(-1);});
    nx.addEventListener('click',function(){stepLB(1);});
    lb.addEventListener('click',function(e){if(e.target===lb)closeLB();});
    document.body.appendChild(lb);
    lb._cl=cl;
  }
  renderLB();lb.hidden=false;document.body.style.overflow='hidden';lb._cl.focus();
}
function renderLB(){
  var g=SITE.gallery[lbIdx];
  lb._st.replaceChildren(pic(g.image,g.caption||B.name,true));
  lb._cap.textContent=g.caption||'';
}
function stepLB(d){var n=SITE.gallery.length;lbIdx=(lbIdx+d+n)%n;renderLB();}
function closeLB(){lb.hidden=true;document.body.style.overflow='';lbFocus&&lbFocus.focus();}

/* ---------- videos ---------- */
function buildVideos(){
  var v=(SITE.videos||[]).filter(function(x){return x&&x.player&&/^https?:/i.test(x.player);});if(!v.length)return null;
  var cards=v.map(function(x,i){
    var btn=el('button',{type:'button',class:'tt-play','data-player':x.player,'aria-label':'Play video '+(i+1)},
      pic(x.poster,'Video preview '+(i+1)),
      el('span',{class:'pbtn'},svg('<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l15 9-15 9z"/></svg>')));
    btn.addEventListener('click',function(){
      var f=el('iframe',{src:btn.getAttribute('data-player'),allow:'autoplay; fullscreen',allowfullscreen:'',title:'Video '+(i+1),loading:'lazy'});
      btn.replaceWith(f);
    });
    return rv(el('div',{class:'vcard'},btn,x.link&&/^https?:/i.test(x.link)?el('a',{href:x.link,target:'_blank',rel:'noopener noreferrer',text:'Open'}):null));
  });
  var s=sec('videos','Videos','alt');
  s.appendChild(wrap(shead('Watch','See the work in motion'),el('div',{class:'vids'},cards)));
  return s;
}

/* ---------- steps and points ---------- */
function buildSteps(){
  var st=(SITE.steps||[]).filter(function(x){return x&&x.title;});if(!st.length)return null;
  var s=sec('process','Process');
  s.appendChild(wrap(shead('How it works','From first look to finished flowers'),
    el('div',{class:'steps'},st.map(function(x,i){
      return rv(el('div',{class:'step-i'},el('b',{text:String(i+1).padStart(2,'0'),'aria-hidden':'true'}),el('h3',{text:x.title}),el('p',{text:x.text})),i*120);}))));
  return s;

    if(obj.userData.tick)obj.userData.tick(t*1.2);
    renderer.render(scene,cam);requestAnimationFrame(frame);
  }
  function kick(){if(!running){running=true;requestAnimationFrame(frame);}}
  if('IntersectionObserver' in window){new IntersectionObserver(function(es){vis=es[0].isIntersecting;if(vis)kick();}).observe(hero);}
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&vis)kick();});
  canvas.addEventListener('webglcontextlost',function(e){e.preventDefault();noGL();});
  kick();
}
function loadThree(){
  if(RM||!hasGL()||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<3)){return noGL();}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.onload=startScene;s.onerror=noGL;document.head.appendChild(s);
}
if('requestIdleCallback' in window)requestIdleCallback(loadThree,{timeout:1500});else setTimeout(loadThree,300);
})();
